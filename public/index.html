<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zapatos Urbanos · Medellín</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 1rem system-ui, sans-serif; color: #151515; background: #f5f5f5; }
    header, footer { padding: 1rem; color: white; background: #151515; }
    header { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem; }
    main { max-width: 70rem; margin: auto; padding: 1.5rem 1rem; }
    h1 { font-size: clamp(2rem, 6vw, 4rem); margin: 0; }
    h2 { margin: 0; }
    #catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
      gap: 1rem;
    }
    article { background: white; border: 1px solid #ccc; border-radius: 1rem; overflow: hidden; }
    .foto { display: grid; place-items: center; aspect-ratio: 4 / 5; background: #e8e8e8; }
    .foto img { width: 100%; height: 100%; object-fit: cover; }
    article form { display: grid; gap: .75rem; padding: 1rem; }
    article p { margin: 0; font-weight: 700; }
    select, button { min-height: 44px; padding: .5rem .75rem; border: 1px solid #777; border-radius: .5rem; font: inherit; }
    button { color: white; background: #151515; cursor: pointer; }
    :focus-visible { outline: 3px solid #2164bd; outline-offset: 3px; }
    dialog { width: min(30rem, calc(100% - 2rem)); border: 1px solid #888; border-radius: 1rem; padding: 1.25rem; }
    dialog::backdrop { background: #000a; }
    .cerrar { text-align: right; margin-bottom: .75rem; }
    dl div { display: flex; justify-content: space-between; gap: .75rem; padding: .5rem 0; }
    dd { margin: 0; white-space: nowrap; }
    .total { border-top: 1px solid #ccc; font-weight: 700; }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; }
    a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <strong>Zapatos Urbanos</strong>
    <span>Medellín, Colombia</span>
  </header>

  <main>
    <h1>Zapatos urbanos</h1>
    <p>Tienda de prueba · Pago simulado</p>
    <section id="catalogo" aria-label="Catálogo"></section>
    <noscript>Activa JavaScript para ver el catálogo y probar la compra.</noscript>
  </main>

  <footer><nav id="redes" aria-label="Redes sociales"></nav></footer>

  <dialog id="compra" aria-labelledby="titulo-compra">
    <form method="dialog" class="cerrar"><button>Cerrar</button></form>
    <h2 id="titulo-compra">Resumen del pedido</h2>
    <p id="seleccion"></p>
    <dl>
      <div><dt>Par en promoción</dt><dd id="subtotal"></dd></div>
      <div><dt>Envío de prueba en Medellín</dt><dd id="envio"></dd></div>
      <div class="total"><dt>Total</dt><dd id="total"></dd></div>
    </dl>
    <button id="pagar" type="button">Simular pago</button>
  </dialog>

  <script>
    const productos = [
      { nombre: 'Blanco con azul celeste', foto: 'celeste.jpg', precio: 150000 },
      { nombre: 'Blanco con gris y suela café', foto: 'gris.jpg', precio: 150000 },
      { nombre: 'Blanco con detalle negro', foto: 'negro.jpg', precio: 150000 }
    ];
    const tallas = [37, 38, 39, 40, 41, 42, 43];
    const envio = 10000;

    // Pega tus enlaces de WhatsApp e Instagram entre las comillas.
    const redes = { WhatsApp: '', Instagram: '' };

    const formato = new Intl.NumberFormat('es-CO');
    const pesos = valor => '$' + formato.format(valor) + ' COP';
    const catalogo = document.querySelector('#catalogo');
    const compra = document.querySelector('#compra');
    const titulo = document.querySelector('#titulo-compra');
    const pagar = document.querySelector('#pagar');

    productos.forEach((producto, indice) => {
      const ficha = document.createElement('article');
      ficha.innerHTML = `
        <div class="foto"></div>
        <form>
          <h2></h2>
          <p></p>
          <label for="talla-${indice}">Talla (EUR)</label>
          <select id="talla-${indice}" name="talla" required>
            <option value="">Elige tu talla</option>
            ${tallas.map(talla => `<option value="${talla}">${talla}</option>`).join('')}
          </select>
          <button type="submit">Revisar pedido</button>
        </form>`;

      ficha.querySelector('h2').textContent = producto.nombre;
      ficha.querySelector('p').textContent = 'Promoción · ' + pesos(producto.precio);

      const foto = document.createElement('img');
      foto.alt = producto.nombre;
      foto.addEventListener('error', () => foto.replaceWith('Foto por agregar'));
      ficha.querySelector('.foto').append(foto);
      foto.src = 'img/' + producto.foto;

      const formulario = ficha.querySelector('form');
      formulario.addEventListener('submit', evento => {
        evento.preventDefault();
        const talla = Number(formulario.elements.talla.value);
        if (!tallas.includes(talla)) return;

        titulo.textContent = 'Resumen del pedido';
        document.querySelector('#seleccion').textContent =
          `${producto.nombre} · Talla ${talla} EUR`;
        document.querySelector('#subtotal').textContent = pesos(producto.precio);
        document.querySelector('#envio').textContent = pesos(envio);
        document.querySelector('#total').textContent = pesos(producto.precio + envio);
        pagar.hidden = false;
        compra.showModal();
      });

      catalogo.append(ficha);
    });

    pagar.addEventListener('click', () => {
      titulo.textContent = 'Pedido de prueba confirmado';
      pagar.hidden = true;
      compra.querySelector('.cerrar button').focus();
    });

    for (const [nombre, enlace] of Object.entries(redes)) {
      const elemento = document.createElement(enlace ? 'a' : 'span');
      elemento.textContent = enlace ? nombre : nombre + ' pendiente';
      if (enlace) elemento.href = enlace;
      document.querySelector('#redes').append(elemento);
    }
  </script>
</body>
</html>
