<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zapatos Urbanos · Medellín</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font: 1rem system-ui, sans-serif;
      color: #151515;
      background: #f5f5f5;
    }

    header, footer {
      padding: 1rem max(1rem, calc((100% - 68rem) / 2));
      background: #151515;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .5rem 1rem;
    }

    main { max-width: 70rem; margin: auto; padding: 2rem 1rem 3rem; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 4rem); }
    h2, h3 { margin: 0; }
    a { color: inherit; }

    .buscador {
      display: grid;
      gap: .4rem;
      max-width: 32rem;
      margin: 1.5rem 0 .75rem;
    }

    .navegacion { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .navegacion button { background: white; color: #151515; }
    .navegacion button[aria-pressed="true"] { background: #151515; color: white; }

    #catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr));
      gap: 1rem;
    }

    article {
      overflow: hidden;
      background: white;
      border: 1px solid #ddd;
      border-radius: 1rem;
    }

    .foto {
      display: grid;
      place-items: center;
      aspect-ratio: 4 / 5;
      background: #ececec;
    }

    .foto img { width: 100%; height: 100%; object-fit: cover; }
    article form { display: grid; gap: .75rem; padding: 1rem; }
    article p { margin: 0; font-weight: 700; }

    input, select, button {
      min-height: 44px;
      padding: .55rem .75rem;
      border: 1px solid #777;
      border-radius: .5rem;
      font: inherit;
    }

    button { color: white; background: #151515; cursor: pointer; }
    :focus-visible { outline: 3px solid #2164bd; outline-offset: 3px; }

    #redes { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; }
    .red { display: inline-flex; align-items: center; gap: .5rem; min-height: 44px; }
    .red svg { width: 24px; height: 24px; }

    dialog {
      width: min(30rem, calc(100% - 2rem));
      border: 1px solid #888;
      border-radius: 1rem;
      padding: 1.25rem;
    }

    dialog::backdrop { background: #000a; }
    .cerrar { display: flex; justify-content: flex-end; margin-bottom: 1rem; }
    dl div { display: flex; justify-content: space-between; gap: .75rem; padding: .5rem 0; }
    dd { margin: 0; white-space: nowrap; }
    .total { border-top: 1px solid #ccc; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <strong>Zapatos Urbanos</strong>
    <span>Medellín, Colombia</span>
  </header>

  <main>
    <h1>Zapatos urbanos</h1>
    <p>Tienda de prueba · Pago simulado</p>

    <div class="buscador" role="search">
      <label for="buscar">Buscar por modelo o color</label>
      <input id="buscar" type="search" placeholder="Ej. celeste, gris o negro">
    </div>

    <nav class="navegacion" aria-label="Secciones del catálogo">
      <button id="ver-todos" type="button" aria-pressed="false">Todos los modelos</button>
      <button id="ver-ofertas" type="button" aria-pressed="true">Ofertas</button>
    </nav>

    <section aria-labelledby="titulo-catalogo">
      <h2 id="titulo-catalogo">Ofertas</h2>
      <p id="resultados" role="status"></p>
      <div id="catalogo"></div>
    </section>

    <noscript>Activa JavaScript para usar el buscador y probar la compra.</noscript>
  </main>

  <footer>
    <nav id="redes" aria-label="Redes sociales"></nav>
  </footer>

  <dialog id="compra" aria-labelledby="titulo-compra">
    <form method="dialog" class="cerrar">
      <button type="submit">Cerrar</button>
    </form>

    <h2 id="titulo-compra" aria-live="polite">Resumen del pedido</h2>
    <p id="seleccion"></p>
    <dl>
      <div><dt>Precio del par</dt><dd id="subtotal"></dd></div>
      <div><dt>Envío de prueba en Medellín</dt><dd id="envio"></dd></div>
      <div class="total"><dt>Total</dt><dd id="total"></dd></div>
    </dl>
    <button id="pagar" type="button">Simular pago</button>
  </dialog>

  <script>
    const productos = [
      { nombre: 'Blanco con azul celeste', foto: 'celeste.jpg.jpg', precio: 150000, oferta: true },
      { nombre: 'Blanco con gris y suela café', foto: 'gris.jpg.jpg', precio: 150000, oferta: true },
      { nombre: 'Blanco con detalle negro', foto: 'negro.jpg.jpg', precio: 150000, oferta: true }
    ];

    const tallas = [37, 38, 39, 40, 41, 42, 43];
    const costoEnvio = 10000;

    // Pega los enlaces completos de tu tienda entre las comillas.
    const whatsapp = '';
    const instagram = '';

    const formato = new Intl.NumberFormat('es-CO');
    const pesos = valor => '$' + formato.format(valor) + ' COP';
    const normalizar = texto =>
      texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

    const catalogo = document.querySelector('#catalogo');
    const buscar = document.querySelector('#buscar');
    const verTodos = document.querySelector('#ver-todos');
    const verOfertas = document.querySelector('#ver-ofertas');
    const tituloCatalogo = document.querySelector('#titulo-catalogo');
    const resultados = document.querySelector('#resultados');
    const compra = document.querySelector('#compra');
    const tituloCompra = document.querySelector('#titulo-compra');
    const pagar = document.querySelector('#pagar');
    let soloOfertas = true;

    function revisarPedido(producto, talla) {
      tituloCompra.textContent = 'Resumen del pedido';
      document.querySelector('#seleccion').textContent =
        `${producto.nombre} · Talla ${talla} EUR`;
      document.querySelector('#subtotal').textContent = pesos(producto.precio);
      document.querySelector('#envio').textContent = pesos(costoEnvio);
      document.querySelector('#total').textContent = pesos(producto.precio + costoEnvio);
      pagar.hidden = false;
      compra.showModal();
    }

    function crearFicha(producto, indice) {
      const ficha = document.createElement('article');
      ficha.innerHTML = `
        <div class="foto"></div>
        <form>
          <h3></h3>
          <p></p>
          <label for="talla-${indice}">Talla (EUR)</label>
          <select id="talla-${indice}" name="talla" required>
            <option value="">Elige tu talla</option>
            ${tallas.map(talla => `<option value="${talla}">${talla}</option>`).join('')}
          </select>
          <button type="submit">Revisar pedido</button>
        </form>`;

      ficha.querySelector('h3').textContent = producto.nombre;
      ficha.querySelector('p').textContent =
        (producto.oferta ? 'Promoción · ' : '') + pesos(producto.precio);

      const imagen = document.createElement('img');
      imagen.alt = producto.nombre;
      imagen.addEventListener('error', () => imagen.replaceWith('Foto no disponible'));
      imagen.src = './img/' + encodeURIComponent(producto.foto);
      ficha.querySelector('.foto').append(imagen);

      const formulario = ficha.querySelector('form');
      formulario.addEventListener('submit', evento => {
        evento.preventDefault();
        const talla = Number(formulario.elements.talla.value);
        if (tallas.includes(talla)) revisarPedido(producto, talla);
      });

      return ficha;
    }

    const fichas = productos.map(crearFicha);

    function mostrarCatalogo() {
      const consulta = normalizar(buscar.value.trim());
      const visibles = fichas.filter((ficha, indice) => {
        const producto = productos[indice];
        return (!soloOfertas || producto.oferta) &&
          normalizar(producto.nombre).includes(consulta);
      });

      tituloCatalogo.textContent = soloOfertas ? 'Ofertas' : 'Todos los modelos';
      verOfertas.setAttribute('aria-pressed', String(soloOfertas));
      verTodos.setAttribute('aria-pressed', String(!soloOfertas));

      resultados.textContent = visibles.length === 0
        ? 'No encontramos modelos en esta sección.'
        : `${visibles.length} ${visibles.length === 1 ? 'modelo' : 'modelos'}`;

      catalogo.replaceChildren(...visibles);
    }

    buscar.addEventListener('input', mostrarCatalogo);
    verTodos.addEventListener('click', () => {
      soloOfertas = false;
      mostrarCatalogo();
    });
    verOfertas.addEventListener('click', () => {
      soloOfertas = true;
      mostrarCatalogo();
    });

    pagar.addEventListener('click', () => {
      tituloCompra.textContent = 'Pedido de prueba confirmado';
      pagar.hidden = true;
      compra.querySelector('.cerrar button').focus();
    });

    const redes = [
      {
        nombre: 'WhatsApp',
        enlace: whatsapp,
        icono: '<path d="M20 11.7a8 8 0 0 1-11.8 7L4 20l1.2-4.1A8 8 0 1 1 20 11.7Z"/><path d="m9 9 1 2-1 1c.7 1.4 1.7 2.4 3.1 3.1l1-1 2 1c.5.3.2 1.5-.7 1.6-3.3.4-7.5-3.8-7.1-7.1.1-.9 1.3-1.2 1.7-.6Z"/>'
      },
      {
        nombre: 'Instagram',
        enlace: instagram,
        icono: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>'
      }
    ];

    for (const { nombre, enlace, icono } of redes) {
      const elemento = document.createElement(enlace ? 'a' : 'span');
      elemento.className = 'red';
      elemento.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">${icono}</svg>`;
      elemento.append(enlace ? nombre : nombre + ' pendiente');
      if (enlace) elemento.href = enlace;
      document.querySelector('#redes').append(elemento);
    }

    mostrarCatalogo();
  </script>
</body>
</html>
